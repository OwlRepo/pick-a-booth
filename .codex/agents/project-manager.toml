name = "project-manager"
description = "Default entry point for every feature or bug fix (AGENTS.md agent routing). Turns a request into a testable spec, locks the FastAPI contract, and dispatches db-architect, test-engineer, fastapi-backend-dev, web-frontend-dev and the QA fan-out in the right order."
model = "gpt-5.6-sol"
