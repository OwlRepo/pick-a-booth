name: ai-gates

# AI engineering workflow gates (docs/ai/testing-strategy.md "Strict TDD",
# docs/ai/agent-orchestration.md). Separate file so upstream syncs of the
# photobooth-app workflows stay conflict-free.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install system apt dependencies
        run: |
          sudo apt update
          sudo apt -y install libturbojpeg python3-pip libgl1 git libcap-dev ffmpeg rclone

      - name: Install the project
        run: uv sync --all-extras --dev

      # Fast and cheap: generated persona files must match agents/src.
      - name: Agent definitions lint
        run: uv run poe agents:lint

      # TDD gate, guard, generator and doc-link tests.
      - name: Tooling tests
        run: uv run poe test:scripts

      # RED proof, tests present per layer, name prefixes and order.
      - name: TDD gate
        env:
          TDD_GATE_BASE: origin/${{ github.base_ref }}
          TDD_GATE_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run poe tdd:gate
